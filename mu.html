<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21071e">
<meta name="robots" content="noindex,nofollow">
<title>mu(sic) • aidan.im</title>
<link rel="stylesheet" href="/mu-player.css?v=6">
</head>
<body>
<svg class="icon-bank" xmlns="http://www.w3.org/2000/svg">
<symbol id="play-icon" viewBox="0 0 24 24">
<path d="M8 5v14l11-7z"/>
</symbol>
<symbol id="pause-icon" viewBox="0 0 24 24">
<path d="M7 5h3v14H7zm7 0h3v14h-3z"/>
</symbol>
<symbol id="prev-icon" viewBox="0 0 24 24">
<path d="M5 5h2v14H5zm13 1v12L9 12z"/>
</symbol>
<symbol id="next-icon" viewBox="0 0 24 24">
<path d="M17 5h2v14h-2zM6 6l9 6-9 6z"/>
</symbol>
<symbol id="shuffle-icon" viewBox="0 0 24 24">
<path d="M16 3h5v5h-2V6.4c-1.7.3-2.8 1.2-4.2 3l-1.2 1.5-1.3-1.7 1-1.2c1.6-2 3.3-3.2 5.7-3.6V3zM3 5h2c2.8 0 4.3 1.3 6 3.6l3.5 4.7c1.5 2 2.5 2.8 4.5 2.8V14l4 4-4 4v-2.9c-2.8 0-4.4-1.3-6.1-3.6L9.4 10C8 8.1 7 7 5 7H3zm0 12h2c1.8 0 2.8-1 4.2-2.8l1.2 1.7C8.8 18 7.3 19 5 19H3z"/>
</symbol>
<symbol id="repeat-icon" viewBox="0 0 24 24">
<path d="M17 2l4 4-4 4V7H7a3 3 0 00-3 3v1H2v-1a5 5 0 015-5h10V2zm5 11v1a5 5 0 01-5 5H7v3l-4-4 4-4v3h10a3 3 0 003-3v-1z"/>
</symbol>
</svg>
<main class="shell">
<header>
<a class="brand" href="/mu">mu<span>!</span>
</a>
<button id="libraryTab" class="pill">your playlists</button>
</header>
<section class="hero">
<h1>soundtrack<br>
<em>your day.</em>
</h1>
</section>
<div class="layout">
<div class="left-column">
<p class="warmup">The first song search can take a minute or two.</p>
<section class="glass player-card" aria-label="Now playing">
<div class="track-head">
<div class="cover" id="cover">
<span>mu!</span>
</div>
<div class="track-meta">
<h2 id="title">nothing playing yet</h2>
<p id="artist">
</p>
<p id="album" class="album">
</p>
</div>
</div>
<div class="time">
<span id="elapsed">0:00</span>
<span id="duration">0:00</span>
</div>
<input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
<div class="controls">
<button id="shuffle" aria-label="Shuffle" aria-pressed="false">
<svg>
<use href="#shuffle-icon"/>
</svg>
</button>
<button id="prev" aria-label="Previous">
<svg>
<use href="#prev-icon"/>
</svg>
</button>
<button id="toggle" class="primary" aria-label="Play or pause">
<svg>
<use id="toggleIcon" href="#play-icon"/>
</svg>
</button>
<button id="next" aria-label="Next">
<svg>
<use href="#next-icon"/>
</svg>
</button>
<button id="repeat" aria-label="Repeat" aria-pressed="false">
<svg>
<use href="#repeat-icon"/>
</svg>
</button>
</div>
<audio id="audio" preload="none">
</audio>
<p class="hint" id="playerStatus" role="status">
</p>
</section>
<section class="glass picks">
<div class="row-title">
<div>
<h2>developer's picks<span>.</span>
</h2>
</div>
<button class="small" id="playPicks">play all</button>
</div>
<div id="picksList" class="track-list">
<p class="empty">Loading picks…</p>
</div>
</section>
</div>
<div class="right-column">
<section class="glass browse">
<h2>search music<span>.</span>
</h2>
<div id="songSearch">
<form id="search" class="search">
<svg viewBox="0 0 24 24" aria-hidden="true">
<circle cx="10.5" cy="10.5" r="6.5"/>
<path d="m16 16 4 4"/>
</svg>
<input aria-controls="suggestions" id="query" placeholder="search songs or artists" maxlength="100" autocomplete="off" aria-label="Search songs or artists" required>
<button type="submit">search</button>
</form>
<div id="suggestions" class="suggestions" hidden>
<p class="hint" id="searchStatus" role="status">
</p>
<div id="results" class="track-list">
</div>
</div>
</div>
</section>
<section class="glass library" id="library">
<div class="row-title">
<div>
<h2>your playlists<span>.</span>
</h2>
</div>
<button class="small" id="create">+ new</button>
</div>
<p class="hint">saved on this device and browser.</p>
<div id="playlists">
</div>
</section>
</div>
</div>
</main>
<script src="/mu-player.js?v=6" defer>
</script>
</body>
</html>
