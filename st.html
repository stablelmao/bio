<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21071e">
  <title>movies &amp; TV • aidan.im</title>
  <link rel="stylesheet" href="/style.css?v=picks-1">
  <link rel="stylesheet" href="/st.css?v=discovery-1">
  <script src="/st.js?v=discovery-1" defer></script>
  <link rel="stylesheet" href="/media-menu.css?v=1">
  <script src="/media-menu.js?v=1" defer></script>
</head>
<body class="media-page stream-page" data-page="movies &amp; TV">
<div class="shell">
  <header class="media-header">
  <div class="brand">
    <a href="/st">st(ream)</a>, a branch of
    <a href="/"><span>aidan.im</span></a>
  </div>
  <a class="media-link" href="/">[ back home ]</a>
</header>
  <main>
    <div class="media-heading"><h1>movies <em>&amp; TV.</em></h1></div>
    <div class="discovery-layout">
    <nav class="discovery-nav" aria-label="Browse movies and TV">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="catalog-menu">Browse menu</button>
      <div class="menu-items" id="catalog-menu">
        <button type="button" data-view="popular" aria-pressed="true">Popular</button>
        <button type="button" data-view="new">New releases</button>
        <button type="button" data-view="rated">Top rated</button>
        <button type="button" data-view="history">Continue watching</button>
        <button type="button" data-view="picks" id="picks">Jaiden’s picks</button>
        <label for="genre">Genre</label><select id="genre"></select>
      </div>
    </nav>
    <div class="discovery-body">
    <div class="media-types" role="group" aria-label="Browse by type">
      <button type="button" data-type="movie" aria-pressed="true">Movies</button>
      <button type="button" data-type="tv" aria-pressed="false">TV shows</button>
    </div>
    <form id="search" class="search">
      <label class="sr" for="query" id="query-label">Search movies</label>
      <input id="query" placeholder="Search movies…" autocomplete="off" maxlength="100">
      <button>Search</button>
    </form>
    <section id="watch" aria-labelledby="watch-title" hidden>
      <div class="row"><h2 id="watch-title"></h2><p>sorry about the ads, just come back here from redirects plz</p><button class="close" id="close" type="button">Close ×</button></div>
      <div id="series" hidden>
        <label>Season <select id="season"></select></label>
        <label>Episode <select id="episode"></select></label>
      </div>
      <p id="watch-status" class="hint" role="status"></p>
      <div class="player" id="player" hidden><iframe id="frame" title="Video player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    </section>
    <section aria-labelledby="heading">
      <h2 id="heading">Popular movies</h2><p id="status" class="hint" role="status"></p>
      <div id="results" class="grid"></div>
      <button id="moreTitles" type="button" hidden>Load more titles</button>
    </section>
    </div></div>
  </main>
  <footer>Player by VidSrc. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
</div>
</body>
</html>
